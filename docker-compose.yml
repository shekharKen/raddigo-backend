services:
  db:
    image: postgis/postgis:16-3.4
    container_name: raddigo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raddigo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raddigo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: raddigo-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/raddigo?sslmode=disable"
      APP_BASE_URL: "http://localhost:8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
