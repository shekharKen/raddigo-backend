services:
  db:
    image: postgis/postgis:16-3.4
    container_name: raddigo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raddigo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raddigo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: raddigo-app
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/raddigo-firebase-adminsdk.json
    volumes:
      - ./raddigo-firebase-adminsdk.json:/app/raddigo-firebase-adminsdk.json:ro
    depends_on:
      db:
        condition: service_healthy
    # environment:
    #   SERVER_ADDR: ":8080"
    #   DATABASE_URL: "postgres://postgres:postgres@db:5432/raddigo?sslmode=disable"
    #   APP_BASE_URL: "http://13.203.195.123:8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
